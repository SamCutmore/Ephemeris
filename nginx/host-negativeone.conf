# Installed on the VPS as /etc/nginx/sites-available/negativeone
# Edge TLS for app + Nexus (Nexus bound to 127.0.0.1 only).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name negativeone.xyz nexus.negativeone.xyz registry.negativeone.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexus.negativeone.xyz;

    ssl_certificate     /etc/letsencrypt/live/negativeone.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/negativeone.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.negativeone.xyz;

    ssl_certificate     /etc/letsencrypt/live/negativeone.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/negativeone.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name negativeone.xyz;

    ssl_certificate     /etc/letsencrypt/live/negativeone.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/negativeone.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Match /api and /api/... (trailing-slash-only /api/ caused 301 /api → /api/ and broke POST)
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
