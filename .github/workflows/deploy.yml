name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: NEXUS_REGISTRY,NEXUS_USERNAME,NEXUS_PASSWORD,GH_TOKEN
          script: |
            set -e
            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/SamCutmore/DYHTG2026.git"
            if [ ! -d /opt/negativeone/.git ]; then
              rm -rf /opt/negativeone
              git clone "$REPO_URL" /opt/negativeone
            fi
            cd /opt/negativeone
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git reset --hard origin/main
            ./opstools/fetch.sh
            ./opstools/up.sh
