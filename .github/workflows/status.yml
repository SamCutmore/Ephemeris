name: status

# Disabled
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 15 \
            "https://negativeone.xyz/api/health")
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
          grep -q '"status":"ok"' /tmp/health.json \
            || grep -q '"status": "ok"' /tmp/health.json