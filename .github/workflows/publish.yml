name: publish

on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/ephemeris-frontend:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/ephemeris-frontend:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/ephemeris-backend:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/ephemeris-backend:latest
