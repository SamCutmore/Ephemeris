services:
  frontend:
    image: ${NEXUS_REGISTRY:-registry.local}/ephemeris-frontend:${IMAGE_TAG:-latest}
    container_name: ephemeris_frontend
    restart: always
    ports:
      - "127.0.0.1:8088:80"

  backend:
    image: ${NEXUS_REGISTRY:-registry.local}/ephemeris-backend:${IMAGE_TAG:-latest}
    container_name: ephemeris_backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - postgres_default
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

networks:
  postgres_default:
    external: true
